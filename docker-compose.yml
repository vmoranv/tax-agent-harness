# 本地开发依赖：PostgreSQL + Redis
# 启动：docker compose up -d
# 停止：docker compose down
services:
  postgres:
    image: postgres:17-alpine
    container_name: harness-pg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness_dev_only
      POSTGRES_DB: harness
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harness -d harness']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
